name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-macos:
    name: LAPSCore (macOS)
    runs-on: macos-15
    defaults:
      run:
        working-directory: LAPSCore
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and test
        run: swift test --parallel

  core-linux:
    # LAPSCore must stay free of Apple-only frameworks so the format layer
    # can be tested anywhere.
    name: LAPSCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    defaults:
      run:
        working-directory: LAPSCore
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test --parallel

  app-macos:
    name: LAPSLens app (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec Apple/project.yml
      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Apple/LAPSLens.xcodeproj \
            -scheme LAPSLens \
            -configuration Debug \
            -destination 'platform=macOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  # Planned (see docs/TESTING.md):
  # - ldap-integration: Samba AD DC service container with the LAPS schema
  # - live: Jamf / Entra smoke tests against test tenants, gated on secrets
  # - release: sign, notarize, staple on tag
