name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-macos:
    name: LAPSCore (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and test
        run: swift test --parallel

  core-linux:
    # Cheap second opinion: LAPSCore must stay free of Apple-only frameworks
    # so the format layer can be tested anywhere.
    name: LAPSCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test --parallel

  # Planned (see docs/TESTING.md):
  # - app: xcodebuild build/test of the SwiftUI app once the Xcode project lands
  # - ldap-integration: Samba AD DC service container with the LAPS schema, LDAPS bind + read
  # - live: Jamf / Entra smoke tests against test tenants, gated on repository secrets
